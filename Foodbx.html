<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FoodTok</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: black;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      height: 100vh;
    }

    .feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .card {
      position: relative;
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 20px;
      left: 15px;
      color: white;
      z-index: 2;
    }

    .food-name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .info {
      margin-bottom: 5px;
      font-size: 18px;
    }

    .buy-btn {
      margin-top: 12px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: #ff3b30;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .buy-btn:hover {
      transform: scale(1.05);
    }

    .side-buttons {
      position: absolute;
      right: 15px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      color: white;
      font-size: 26px;
      z-index: 2;
    }

    .icon {
      text-align: center;
      cursor: pointer;
    }

    .icon span {
      display: block;
      font-size: 14px;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .food-name {
        font-size: 22px;
      }

      .info {
        font-size: 16px;
      }

      .buy-btn {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="feed">

    <!-- FOOD CARD 1 -->
    <div class="card">

      <video
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        autoplay
        muted
        loop
      ></video>

      <div class="overlay">

        <div class="food-name">
          Smash Burger
        </div>

        <div class="info">
          ⭐ 4.8 Rating
        </div>

        <div class="info">
          💲 8.99
        </div>

        <div class="info">
          ⏱ ETA: 22 mins
        </div>

        <button
          class="buy-btn"
          onclick="buyFood('Smash Burger', 8.99)"
        >
          Buy Now
        </button>
      </div>

      <div class="side-buttons">

        <div class="icon">
          ❤️
          <span>12k</span>
        </div>

        <div class="icon">
          💬
          <span>431</span>
        </div>

        <div class="icon">
          ↗
          <span>Share</span>
        </div>

      </div>

    </div>

    <!-- FOOD CARD 2 -->
    <div class="card">

      <video
        src="https://www.w3schools.com/html/movie.mp4"
        autoplay
        muted
        loop
      ></video>

      <div class="overlay">

        <div class="food-name">
          Japanese Ramen
        </div>

        <div class="info">
          ⭐ 4.9 Rating
        </div>

        <div class="info">
          💲 12.50
        </div>

        <div class="info">
          ⏱ ETA: 18 mins
        </div>

        <button
          class="buy-btn"
          onclick="buyFood('Japanese Ramen', 12.50)"
        >
          Buy Now
        </button>

      </div>

      <div class="side-buttons">

        <div class="icon">
          ❤️
          <span>8k</span>
        </div>

        <div class="icon">
          💬
          <span>250</span>
        </div>

        <div class="icon">
          ↗
          <span>Share</span>
        </div>

      </div>

    </div>

  </div>

  <script>

    function buyFood(name, price) {

      alert(
        `Buying ${name} for $${price}`
      );

      // future:
      // redirect to checkout page
      // connect payment gateway
      // create order
    }

    // autoplay current video only
    const videos =
      document.querySelectorAll("video");

    const observer =
      new IntersectionObserver(
        entries => {

          entries.forEach(entry => {

            if (entry.isIntersecting) {
              entry.target.play();
            } else {
              entry.target.pause();
            }

          });

        },
        {
          threshold: 0.6
        }
      );

    videos.forEach(video => {
      observer.observe(video);
    });

  </script>

</body>
</html>
